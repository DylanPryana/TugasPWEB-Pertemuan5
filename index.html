<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Management</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <div class="logo"><i class="fa-solid fa-graduation-cap"></i> Student Management</div>
  <div class="menu">
    <a href="#">Home</a>
    <a href="#">Students</a>
    <a href="#">About</a>
    <i class="fa-solid fa-circle-user ikon-user"></i>
  </div>
</nav>

<main class="container">
  <!-- Form -->
  <section class="kartu form-kartu">
    <h2>Form Student</h2>
    <label for="nim">NRP</label>
    <input type="text" id="nim" placeholder="Masukkan NRP">

    <label for="nama">Nama Lengkap</label>
    <input type="text" id="nama" placeholder="Masukkan nama lengkap">

    <label for="jurusan">Jurusan</label>
    <select id="jurusan">
      <option value="">Pilih Jurusan</option>
      <option>Teknik Informatika</option>
      <option>Sistem Informasi</option>
      <option>Teknik Komputer</option>
      <option>Teknik Elektro</option>
    </select>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Masukkan email">

    <div class="tombol-form">
      <button class="btn btn-simpan" onclick="simpanData()"><i class="fa-solid fa-floppy-disk"></i> Simpan</button>
      <button class="btn btn-batal" onclick="batalEdit()">Batal</button>
      <button class="btn btn-reset" onclick="resetForm()"><i class="fa-solid fa-rotate"></i> Reset</button>
    </div>
  </section>

  <!-- Tabel -->
  <section class="kartu tabel-kartu">
    <div class="atas-tabel">
      <h2>Data Mahasiswa</h2>
      <div class="kotak-cari">
        <input type="text" id="cari" placeholder="Cari mahasiswa..." oninput="halamanSekarang=1; tampilkanData()">
        <i class="fa-solid fa-magnifying-glass"></i>
      </div>
    </div>

    <div class="bungkus-tabel">
      <table>
        <thead>
          <tr><th>No</th><th>NRP</th><th>Nama</th><th>Jurusan</th><th>Email</th><th class="tengah">Aksi</th></tr>
        </thead>
        <tbody id="isiTabel"></tbody>
      </table>
    </div>

    <div class="bawah-tabel">
      <span></span>
      <div id="paginasi" class="paginasi"></div>
    </div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
